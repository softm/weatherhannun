  <!-- Pointer Needle -->
  <circle cx="32" cy="38" r="4" fill="#0F172A"/>
  <line x1="32" y1="38" x2="42" y2="24" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
  <!-- Center Accent -->
  <circle cx="32" cy="38" r="1.5" fill="#38BDF8"/>
  <defs>
    <linearGradient id="gauge-grad" x1="14" y1="42" x2="46" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.6" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>
