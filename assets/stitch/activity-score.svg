<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Dial Arc -->
  <path d="M14 42A22 22 0 1 1 50 42" stroke="#E2E8F0" stroke-width="5" stroke-linecap="round"/>
  <!-- Progress Highlight Arc (Great score) -->
