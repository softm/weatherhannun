name: Verify web app
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.css'
      - '**/*.html'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.css'
      - '**/*.html'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/verify.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Node
        run: node --version
      - name: Run web app tests
        run: node --test tests/*.test.cjs
      - name: Parse frontend JavaScript
        run: |
          for file in *.js; do
            node --check "$file"
          done
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Mobile UI regression
        run: npx playwright test tests/e2e/mobile-experience.spec.mjs
      - name: Upload UI screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-results
          path: test-results/
          retention-days: 7
