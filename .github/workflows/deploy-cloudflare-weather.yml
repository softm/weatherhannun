name: Deploy WeatherHannun Cloudflare API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/cloudflare-weather/**'
      - '.github/workflows/deploy-cloudflare-weather.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cloudflare-weather
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Install shared provider dependencies
        working-directory: services/weather-api
        run: npm ci --no-audit --no-fund
      - name: Execute API tests
        run: npm test
      - name: Check Cloudflare bundle
        run: |
          cp wrangler.template.toml wrangler.toml
          sed -i 's/__D1_DATABASE_ID__/00000000-0000-0000-0000-000000000000/g' wrangler.toml
          npx wrangler deploy --dry-run

  deploy:
    needs: verify
    if: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-weather
    defaults:
      run:
        working-directory: services/cloudflare-weather
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install shared provider dependencies
        working-directory: services/weather-api
        run: npm ci --no-audit --no-fund
      - name: Prepare Cloudflare configuration
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$D1_DATABASE_ID" && test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          cp wrangler.template.toml wrangler.toml
          sed -i "s/__D1_DATABASE_ID__/$D1_DATABASE_ID/g" wrangler.toml
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
